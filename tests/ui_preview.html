<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Codex 工具箱视觉预览</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#080b12}</style>
</head>
<body>
<iframe id="preview" src="../ui.html"></iframe>
<script>
const providers = [
  {id:'openai',name:'OpenAI 登录（当前 Codex 账户）',kind:'official',model:'gpt-5.6-terra',reasoning_effort:'high',proxy:false,current:false},
  {id:'qwen',name:'通义千问',kind:'direct',model:'qwen3.8-max',reasoning_effort:'high',proxy:false,current:true},
  {id:'deepseek',name:'DeepSeek 官方',kind:'direct',model:'deepseek-v4-pro',reasoning_effort:'',proxy:true,current:false},
  {id:'relay',name:'硅基流动',kind:'relay',model:'DeepSeek-V4',reasoning_effort:'medium',proxy:true,current:false},
];
document.getElementById('preview').addEventListener('load', event => {
  const target = event.target.contentWindow;
  target.pywebview = {api:{
    get_community_experiments: async()=>({channel_switching:true,session_routing:true,session_archive:true,local_appearance:false,surface_translation:true,diagnostics:true}),
    set_community_experiment: async(feature,enabled)=>({ok:true,features:{channel_switching:true,session_routing:true,session_archive:true,local_appearance:feature==='local_appearance'?enabled:false,surface_translation:feature==='surface_translation'?enabled:true,diagnostics:true,[feature]:enabled}}),
    launch_codex_hub: async()=>({ok:true,message:'Codex 已启动；已加载：翻译。'}),
    save_background_settings: async()=>({ok:true,message:'背景设置已保存'}),
    save_surface_translation_settings: async()=>({ok:true,message:'翻译设置已保存'}),
    get_presets: async()=>({presets:[]}),
    get_providers: async()=>providers,
    test_all_provider_connections: async()=>({ok:true,results:providers.map(p=>({id:p.id,name:p.name,ok:true,message:p.id==='openai'?'当前 Codex 登录状态':'HTTP 200：连接成功'}))}),
    get_status: async()=>({provider:'qwen',provider_name:'通义千问',model:'qwen3.8-max',reasoning_effort:'high',codex_running:true,proxy_running:false,proxy_url:''}),
    get_sessions: async()=>[
      {id:'1',title:'帮我看看千问会话为什么无法响应',provider:'qwen',provider_name:'通义千问',model:'qwen3.8-max',reasoning_effort:'high',route_mode:'fixed',route_label:'固定通道'},
      {id:'2',title:'Codex 工具箱公开发布优化',provider:'openai',provider_name:'OpenAI 登录（当前 Codex 账户）',model:'gpt-5.6-terra',reasoning_effort:'high',route_mode:'follow',route_label:'跟随全局'},
      {id:'3',title:'归档功能验证与恢复测试',provider:'openai',provider_name:'OpenAI 登录（当前 Codex 账户）',model:'qwen3.8-max',reasoning_effort:'medium',model_mismatch:true,route_mode:'same',route_label:'与默认一致'},
    ],
    get_archived_sessions: async()=>[
      {id:'4',title:'旧版代理连接测试',provider_name:'通义千问'},
    ],
    get_diagnostics: async()=>({data_dir:'本地预览',backup_dir:'本地预览',provider_count:4,route_count:2,backup_count:0,codex_running:true,community_experiments:{session_routing:true,local_appearance:false},appearance_saved:false}),
    preview_session_route: async(ids, id)=>({ok:true,codex_running:false,provider:providers.find(item=>item.id===id).name,model:providers.find(item=>item.id===id).model,reasoning_effort:'high',targets:ids.map(id=>({id,title:'预览会话'}))}),
    start_route_operation: async(ids, id, mode)=>({ok:true,operation_id:'preview-route-1'}),
    get_route_operation: async()=>({ok:true,state:'success',count:1,provider:'qwen',message:'预览操作完成'}),
    switch_sessions: async(ids)=>({ok:true,count:ids.length}),
    follow_sessions: async(ids)=>({ok:true,count:ids.length,provider:'qwen'}),
  }};
  target.dispatchEvent(new target.Event('pywebviewready'));
  if (location.hash === '#archive') {
    setTimeout(() => target.document.querySelector('[data-tab="tab-archive"]').click(), 80);
  }
  if (location.hash === '#routes') {
    setTimeout(() => target.document.querySelector('[data-tab="tab-routes"]').click(), 80);
  }
  if (location.hash === '#modal') {
    setTimeout(() => target.openProviderModal(), 80);
  }
});
</script>
</body>
</html>
