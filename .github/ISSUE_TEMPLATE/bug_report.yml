name: Bug 报告
description: 报告可复现的问题（请删除密钥和会话内容）
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请不要上传 API Key、providers.json、Codex 数据库或会话文件。"
  - type: input
    id: version
    attributes:
      label: 工具箱版本
    validations:
      required: true
  - type: input
    id: codex_version
    attributes:
      label: Codex 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 错误信息与期望结果
    validations:
      required: true
