name: Build release

on:
  workflow_dispatch:
  push:
    branches: ["build/release-*"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - shell: pwsh
        run: .\build.ps1
      - id: version
        shell: pwsh
        run: |
          $version = python -c "from version import __version__; print(__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: CodexToolbox-Windows-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*-windows-x64.zip
            dist/*-windows-x64.zip.sha256

  macos:
    uses: ./.github/workflows/macos-installer.yml

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: CodexToolbox-*
          merge-multiple: true
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Codex Toolbox ${{ needs.windows.outputs.version }}
          prerelease: ${{ contains(needs.windows.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip
            release-assets/*.dmg
            release-assets/*.sha256
          body: |
            Windows x64、macOS Apple Silicon 与 Intel 测试版。下载下方对应系统的二进制附件即可，无需下载 GitHub 自动提供的 Source code。

            macOS 需要 15 或更新版本。打开 DMG，将应用拖到 Applications；内置 Python 和 PowerShell，无需另装开发环境。测试包尚未通过 Developer ID 签名与 Apple 公证，首次打开可能需要在系统“隐私与安全性”中确认。Claude 桌面集成仍仅支持 Windows。

            自动构建验证与完整桌面实测不同；macOS 的账号、Keychain、Codex 翻译及会话操作仍需朋友在实际环境验收。
