name: Build macOS installers

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-macos.txt
      - name: Verify host architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"
      - run: python scripts/check_secrets.py
      - name: Build standalone app and installer
        run: bash build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CodexToolbox-macOS-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
