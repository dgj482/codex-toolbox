[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-toolbox"
dynamic = ["version"]
description = "Windows Codex desktop toolbox for provider switching and experimental session archive/restore helpers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.setuptools]
py-modules = [
    "auth_helper",
    "codex_app",
    "codex_proxy",
    "codex_surface_translation",
    "codex_toolbox",
    "secret_store",
    "version",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
