[project]
name = "codex-toolbox"
version = "0.1.1b1"
description = "Windows Codex desktop toolbox for provider switching and experimental session archive/restore helpers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
